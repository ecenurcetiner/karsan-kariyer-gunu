<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karsan Yönetim Paneli</title>
    <link rel="icon" type="image/png" href="Karsan.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <img src="karsan.jpg" alt="Karsan Logo" class="logo">
            <h2>Yönetici Paneli</h2>
        </header>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link">Ajanda</a>
            <a href="networking.html" class="nav-link">Networking Havuzu</a>
        </nav>
        
        <div id="login-section" class="admin-panel">
            <input type="text" id="username" placeholder="Kullanıcı Adı">
            <input type="password" id="password" placeholder="Şifre">
            <button onclick="login()">Giriş Yap</button>
        </div>

        <div id="edit-section" class="admin-panel" style="display:none;">
            <div class="admin-tabs">
                <button onclick="showSection('agenda-edit')">Ajanda Yönetimi</button>
                <button onclick="showSection('network-edit')">Havuz Yönetimi</button>
                <button onclick="logout()" class="btn-dark">Çıkış</button>
            </div>
            
            <div id="agenda-edit" class="section">
                <h3>Etkinlik Ekle</h3>
                <div class="time-select">
                    <select id="start-h"></select>:<select id="start-m"></select> - 
                    <select id="end-h"></select>:<select id="end-m"></select>
                </div>
                <input type="text" id="title" placeholder="Etkinlik Adı">
                <button onclick="addEvent()">Ekle</button>
                
                <table style="margin-top:20px;">
                    <thead>
                        <tr>
                            <th>Saat</th>
                            <th>Başlık</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="admin-agenda-body"></tbody>
                </table>
            </div>

            <div id="network-edit" class="section" style="display:none;">
                <h3>Profil Havuzu</h3>
                <table>
                    <thead>
                        <tr>
                            <th>İsim</th>
                            <th>Üni/Dept</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="admin-network-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
