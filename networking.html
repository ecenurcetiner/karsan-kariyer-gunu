<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Karsan Kariyer Günü - Networking</title>
    <link rel="icon" type="image/png" href="Karsan.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container" data-aos="fade-up">
        <header>
            <img src="karsan.jpg" alt="Karsan Logo" class="logo">
        </header>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link">Ajanda</a>
            <a href="networking.html" class="nav-link active">Networking Havuzu</a>
        </nav>
        <div class="header-action" data-aos="fade-in">
            <button onclick="toggleNetworkForm()" class="btn-primary">+ Yeni Ekle</button>
        </div>
        <div id="network-form-section" class="form-section" style="display:none;" data-aos="slide-down">
            <div class="form-grid">
                <input type="text" id="net-name" placeholder="İsim Soyisim">
                <input type="text" id="net-uni" placeholder="Üniversite ya da Departman">
                <input type="text" id="net-dept" placeholder="Bölüm ya da Pozisyon">
                <input type="text" id="net-linkedin" placeholder="Linkedin Profil URL">
            </div>
            <button onclick="addNetwork()" class="btn-submit">Listeye Ekle</button>
        </div>
        <div id="networking-grid" class="grid-container" data-aos="fade-up" data-aos-delay="200"></div>
    </div>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="app.js"></script>
</body>
</html>
